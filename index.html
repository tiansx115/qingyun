<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="青云问道录" />
<meta name="theme-color" content="#070809" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<title>青云问道录 · 3A 电影写实修仙 RPG</title>
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>

<div id="rotate-hint">
  <div style="font-size:20px;letter-spacing:3px;margin-bottom:8px;">请横屏执卷</div>
  <div style="font-size:12.5px;color:var(--muted);">《青云问道录》为 3A 全屏电影横屏界面，横置手机以获最佳体验。</div>
</div>
<div id="app">
  <div id="world-viewport"></div>
  <div id="world-layer"></div>
  <canvas id="fx-canvas"></canvas>

  <!-- Top-Left 3A Weathered-Gold Ink-Mist Ring Avatar + Minimalist Status -->
  <div class="hud-tl" id="hud-tl">
    <div class="arc-avatar">
      <img class="avatar-face" src="assets/chars/hero.webp" alt="道友" />
      <img class="avatar-ring" src="assets/ui3a/avatar_ring.png" alt="" />
    </div>
    <div class="hud-tl-meta">
      <div class="hud-realm-seal" id="hud-realm-txt">炼气一层</div>
      <div class="hud-mini-bars">
        <div class="mini-bar hp"><i id="bar-hp" style="width:100%"></i></div>
        <div class="mini-bar qi"><i id="bar-qi" style="width:100%"></i></div>
      </div>
      <div class="hud-mini-nums"><span id="bar-hp-txt">120/120</span> · <span id="bar-qi-txt">80/80</span></div>
    </div>
  </div>

  <!-- Top-Right Frosted Pill -->
  <div class="hud-tr" id="hud-tr">
    <div class="glass-pill">
      <b id="hud-date">第1年·春</b>
      <span class="sep"></span>
      <span><img class="mini-ico" src="assets/items/spirit_stone.webp" /><b id="hud-stone">70</b></span>
      <span class="sep"></span>
      <span>寿元 <b id="hud-age">18/100岁</b></span>
    </div>
    <div class="timeline-note" id="hud-timeline">第1年·夏：青云剑宗外门试剑</div>
  </div>

  <div class="hud-tc" id="hud-tc"></div>
  <div class="hud-bl" id="hud-bl"></div>
  <div class="hud-br" id="hud-br"></div>

  <div id="dialogue-root"></div>
  <div id="combat-root"></div>
  <div id="panel-root"></div>
  <div class="title-screen" id="title-root"></div>
  <div class="ver-badge" id="ver-badge">v6.0.1</div>
</div>
<div class="toast" id="toast"></div>

<script src="engine/icons.js"></script>
<script src="data/skills_items.js"></script>
<script src="data/beasts.js"></script>
<script src="data/world.js"></script>
<script src="data/allies.js"></script>
<script src="data/events.js"></script>
<script src="engine/audio_fx.js"></script>
<script src="engine/combat.js"></script>
<script src="engine/minigames.js"></script>
<script src="engine/app.js"></script>
</body>
</html>
