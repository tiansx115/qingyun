.vignette {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(8,6,5,0.88) 100%);
}
#fx-canvas {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  width: 100%; height: 100%;
}
.shake { animation: shakeAnim 0.32s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shakeAnim {
  10%, 90% { transform: translate3d(-3px, 0, 0); }
  20%, 80% { transform: translate3d(5px, 2px, 0); }
  30%, 50%, 70% { transform: translate3d(-6px, -2px, 0); }
  40%, 60% { transform: translate3d(5px, 1px, 0); }
}

#rotate-hint {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(10, 8, 7, 0.96); color: var(--gold-2);
  flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
}
@media screen and (orientation: portrait) and (max-width: 760px) {
  #rotate-hint { display: flex; }
}

.shell {
  position: relative; z-index: 3; flex: 1; display: grid;
  grid-template-columns: 225px 1fr 148px;
  gap: 10px; padding: 10px 14px; height: 100%; min-height: 0;
}
.panel {
  background: linear-gradient(165deg, rgba(33,24,19,0.92), rgba(16,12,10,0.94));
  border: 1.5px solid var(--gold-dim);
  box-shadow: inset 0 0 18px rgba(0,0,0,0.75), 0 8px 24px rgba(0,0,0,0.65);
  border-radius: 8px;
  position: relative;
}
.panel::before {
  content: ""; position: absolute; inset: 3px;
  border: 1px solid rgba(212,175,55,0.16); border-radius: 5px; pointer-events: none;
}

.left-col { display: flex; flex-direction: column; padding: 8px 10px; overflow: hidden; }
.char-header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--gold-dim); padding-bottom: 5px; margin-bottom: 6px;
}
.char-name { font-size: 15px; font-weight: 700; color: var(--gold-2); letter-spacing: 0.5px; }
.realm-badge {
  font-size: 11px; padding: 2px 7px; border-radius: 10px;
  background: rgba(212,175,55,0.16); border: 1px solid var(--gold-1); color: var(--gold-2);
}
.portrait-box {
  position: relative; height: 165px; display: flex; justify-content: center; align-items: flex-end;
  background: radial-gradient(circle at 50% 65%, rgba(212,175,55,0.15), rgba(10,8,7,0.8) 75%);
  border: 1px solid rgba(212,175,55,0.22); border-radius: 6px; overflow: hidden; margin-bottom: 7px;
}
.portrait-box img {
  height: 102%; width: auto; object-fit: contain;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.85));
}
.talent-tag {
  position: absolute; bottom: 4px; left: 6px; right: 6px; text-align: center;
  font-size: 10px; background: rgba(12,10,9,0.82); color: var(--gold-2);
  border: 1px solid rgba(212,175,55,0.3); border-radius: 4px; padding: 2px 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar-row { margin-bottom: 5px; }
.bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.bar-track { height: 7px; background: rgba(0,0,0,0.65); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
.bar-fill { height: 100%; transition: width 0.28s ease; }
.hp-fill { background: linear-gradient(90deg, #8e2424, #d64545); }
.qi-fill { background: linear-gradient(90deg, #2b6291, #53a9e8); }
.exp-fill { background: linear-gradient(90deg, #9a7420, #ebca67); }
.stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px;
  margin-top: auto; padding-top: 6px; border-top: 1px solid rgba(212,175,55,0.2);
  font-size: 11px;
}
.stat-item { display: flex; justify-content: space-between; color: var(--text-muted); }
.stat-item b { color: var(--text-main); font-weight: 600; }

.center-col { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.top-status {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; font-size: 12px; flex-shrink: 0;
}
.top-status .loc-title { font-size: 14px; font-weight: 700; color: var(--gold-2); }
.top-chips { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--text-muted); }
.top-chips span b { color: var(--gold-2); }

.stage-body {
  flex: 1; min-height: 0; padding: 12px 14px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.stage-body::-webkit-scrollbar { width: 5px; }
.stage-body::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

.right-col { display: flex; flex-direction: column; gap: 6px; padding: 8px; justify-content: space-between; }
.nav-btn {
  width: 100%; padding: 8px 6px; border-radius: 6px; cursor: pointer;
  background: linear-gradient(180deg, #2d211a, #1a130f);
  border: 1px solid rgba(212,175,55,0.38); color: var(--text-main);
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px;
  text-align: center; transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
}
.nav-btn:active { transform: scale(0.96); }
.nav-btn.active {
  background: linear-gradient(180deg, #5e4418, #38270d);
  border-color: var(--gold-2); color: var(--gold-2);
  box-shadow: 0 0 12px rgba(212,175,55,0.3);
}
.btn-action {
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  background: linear-gradient(180deg, #3c2b20, #231812);
  border: 1px solid var(--gold-1); color: var(--gold-2);
  font-size: 12.5px; font-weight: 600; transition: all 0.15s;
}
.btn-action:active { transform: scale(0.97); }
.btn-action.secondary {
  background: rgba(25,20,17,0.85); border-color: rgba(212,175,55,0.35); color: var(--text-main);
}

.loc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.loc-card {
  background: rgba(24,18,14,0.85); border: 1px solid rgba(212,175,55,0.28);
  border-radius: 7px; padding: 9px 10px; cursor: pointer; transition: 0.15s;
  display: flex; flex-direction: column; gap: 4px;
}
.loc-card:hover, .loc-card:active { border-color: var(--gold-2); background: rgba(48,35,23,0.88); }
.loc-card .l-name { font-size: 13px; font-weight: 700; color: var(--gold-2); }
.loc-card .l-tag { font-size: 10px; color: #e2b86b; opacity: 0.85; }
.loc-card .l-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

.story-box {
  background: rgba(14,11,9,0.78); border: 1px solid rgba(212,175,55,0.28);
  border-radius: 7px; padding: 11px 13px; line-height: 1.68; font-size: 13px;
}
.speaker-line { display: flex; gap: 10px; align-items: flex-start; }
.speaker-ava {
  width: 56px; height: 74px; border-radius: 5px; object-fit: cover; object-position: top;
  border: 1px solid var(--gold-1); background: #14110f; flex-shrink: 0;
}
.speaker-name { color: var(--gold-2); font-weight: 700; font-size: 13px; margin-bottom: 3px; }
.choices-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.choice-btn {
  text-align: left; padding: 8px 12px; border-radius: 6px; cursor: pointer;
  background: linear-gradient(90deg, rgba(45,33,24,0.92), rgba(26,19,15,0.92));
  border: 1px solid rgba(212,175,55,0.35); color: var(--text-main); font-size: 12.5px;
  display: flex; justify-content: space-between; align-items: center;
}
.choice-btn:active { border-color: var(--gold-2); transform: scale(0.99); }
.choice-hint { font-size: 10.5px; color: var(--gold-2); opacity: 0.85; margin-left: 8px; flex-shrink: 0; }

.battle-arena {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: rgba(12,9,8,0.72); border: 1px solid rgba(212,175,55,0.25);
  border-radius: 8px; padding: 10px 14px;
}
.fighter { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.fighter-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.battle-log {
  flex: 1; min-height: 75px; max-height: 115px; overflow-y: auto;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; padding: 7px 10px; font-size: 11.5px; line-height: 1.5; color: var(--text-muted);
}
.skill-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.card-row {
  background: rgba(20,16,13,0.84); border: 1px solid rgba(212,175,55,0.24);
  border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.card-row h4 { margin: 0 0 2px; font-size: 12.5px; color: var(--gold-2); }
.card-row p { margin: 0; font-size: 11px; color: var(--text-muted); }

#modal-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(8,6,5,0.92);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
  width: min(740px, 96vw); max-height: 90vh; overflow-y: auto;
  background: linear-gradient(160deg, #211813, #120e0b);
  border: 2px solid var(--gold-1); border-radius: 10px; padding: 18px 22px;
  box-shadow: 0 0 40px rgba(0,0,0,0.9);
}
.modal-title { font-size: 22px; font-weight: 800; color: var(--gold-2); margin: 0 0 6px; letter-spacing: 2px; }
.modal-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; }
.quiz-opt {
  display: block; width: 100%; text-align: left; margin-bottom: 8px;
  padding: 10px 13px; border-radius: 6px; cursor: pointer;
  background: rgba(36,27,21,0.9); border: 1px solid rgba(212,175,55,0.32);
  color: var(--text-main); font-size: 13px;
}
.quiz-opt:hover, .quiz-opt:active { border-color: var(--gold-2); background: rgba(65,48,26,0.9); }

.toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
  background: rgba(24,18,13,0.96); border: 1px solid var(--gold-2); color: var(--gold-2);
  padding: 7px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,0.7); pointer-events: none;
  opacity: 0; transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
</style>
</head>

const SFX = {
  enabled: true, ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(type) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    if (type === 'click') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.07);
    } else if (type === 'sword') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(780, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.16);
      gain.gain.setValueAtTime(0.11, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'thunder') {
      osc.type = 'square'; osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.35);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.start(now); osc.stop(now + 0.37);
    } else if (type === 'levelup') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554, now + 0.08);
      osc.frequency.setValueAtTime(659, now + 0.16);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.36);
    }
  }
};

const FX = {
  canvas: document.getElementById('fx-canvas'),
  ctx: null, particles: [],
  init() {
    this.ctx = this.canvas.getContext('2d');
    const resize = () => { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();
    for (let i = 0; i < 32; i++) this.particles.push(this.makeAmbient());
    const loop = () => { this.update(); requestAnimationFrame(loop); };
    loop();
  },
  makeAmbient() {
    return {
      x: Math.random() * (this.canvas.width || 900),
      y: Math.random() * (this.canvas.height || 500),
      vx: (Math.random() - 0.3) * 0.4,
      vy: -0.25 - Math.random() * 0.4,
      r: 1 + Math.random() * 2,
      alpha: 0.25 + Math.random() * 0.45,
      color: Math.random() > 0.3 ? '243,215,120' : '160,220,255',
      life: -1
    };
  },
  burst(color = '243,215,120', count = 24) {
    const cx = this.canvas.width * 0.52, cy = this.canvas.height * 0.45;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 6;
      this.particles.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: 1.5 + Math.random()*3, alpha: 1, color, life: 28 + Math.random()*18 });
    }
  },
  update() {
    const c = this.ctx, w = this.canvas.width, h = this.canvas.height;
    c.clearRect(0, 0, w, h);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.life > 0) {
        p.life--; p.alpha = p.life / 40;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      } else {
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x > w + 10) p.x = -10;
      }
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(${p.color},${Math.max(0, p.alpha)})`; c.fill();
    }
  }
};

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

}

function advanceTime(months = 1) {
  G.month += months;
  if (G.month % 12 === 1) G.age += 1;
  if (G.age >= G.maxAge) {
    activeScene = {
      speaker: '岁月无情', img: ASSETS.hero,
      text: `光阴荏苒，你的寿元已届 ${G.maxAge} 岁大限。虽未登临仙道绝顶，但你一生游历山河、广结善缘，临终前门下弟子与故交齐聚送行，亦算无憾此生。`,
      choices: [{ text:'重入轮回，再续仙途', action: () => startQuiz() }]
    };
  }
}

function getDateStr() {
  const y = Math.floor((G.month - 1) / 12) + 1;
  const s = ['春','春','春','夏','夏','夏','秋','秋','秋','冬','冬','冬'][(G.month - 1) % 12];
  return `第${y}年·${s}`;
}

function gainExp(amt) {
  const bonus = Math.floor(amt * (1 + G.wit * 0.03));
  G.exp += bonus;
  const need = REALMS[G.realmIdx].exp;
  if (G.exp >= need && !REALMS[G.realmIdx + 1]?.tribulation) {
    tryRealmUp(false);
  }
  return bonus;
}

function tryRealmUp(fromAltar) {
  const next = REALMS[G.realmIdx + 1];
  if (!next) return showToast('已至当前版本最高境界。');
  if (G.exp < REALMS[G.realmIdx].exp) return showToast('修为尚未圆满，需继续修炼或历练。');
  if (next.tribulation && !fromAltar) {
    showToast('大境界突破需前往【九霄渡劫台】引雷破境。');
    return;
  }
  G.exp -= REALMS[G.realmIdx].exp;
  G.realmIdx++;
  G.maxHp = next.maxHp + G.body * 4;
  G.maxQi = next.maxQi + G.wit * 3;
  G.hp = G.maxHp; G.qi = G.maxQi;
  G.maxAge += next.ageBonus;
  SFX.play('levelup');
  FX.burst('243,215,120', 36);
  showToast(`突破成功！踏入【${next.name}】，寿元增至 ${G.maxAge} 岁。`);
}

function startQuiz() {
  G = defaultState();
  let step = 0;
  const modal = document.getElementById('modal-overlay');
  const card = document.getElementById('modal-card');
  modal.style.display = 'flex';

  function renderStep() {
    if (step === 0 && !G._introDone) {
      card.innerHTML = `
        <h2 class="modal-title">青云问道录</h2>
        <p class="modal-sub">高自由度修仙世界 · 经典门派传承 × 反套路江湖抉择</p>
        <div class="story-box" style="margin-bottom:14px;">
          天地灵气潮汐将至，东洲各大宗门广收门徒，鬼市暗流涌动，古修洞府接连现世。<br>
          你本是一介身无长物的凡尘少年，机缘巧合得一枚微光古玉，自此踏入修真界。<br>
          是拜入名门正派以剑问道，还是在坊市与秘境边缘左右逢源、稳步长生，皆由你自己抉择。
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn-action" id="btn-new">测灵根 · 踏入仙途</button>
          <button class="btn-action secondary" id="btn-load-auto">读取上次自动存档</button>
        </div>
      `;
      document.getElementById('btn-new').onclick = () => { SFX.play('click'); G._introDone = true; renderStep(); };
      document.getElementById('btn-load-auto').onclick = () => {
        SFX.play('click');
        if (loadGame('auto')) { modal.style.display = 'none'; renderAll(); }
        else showToast('暂无自动存档，请先开启新局。');
      };
      return;
    }

    if (step < QUIZ.length) {
      const q = QUIZ[step];
      card.innerHTML = `
        <h3 class="modal-title" style="font-size:17px;">问道初测 (${step+1}/${QUIZ.length})</h3>
        <p class="modal-sub">${q.q}</p>
        <div id="q-opts"></div>
      `;
      const box = document.getElementById('q-opts');
      q.opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'quiz-opt';
        b.textContent = o.t;
        b.onclick = () => {
          SFX.play('click');
          for (const [k,v] of Object.entries(o.eff)) {
            if (k === 'root' || k === 'talent') G[k] = v;
            else if (k === 'skill') { if (!G.skills.includes(v)) G.skills.push(v); }
            else G[k] = (G[k] || 0) + v;
          }
          step++; renderStep();
        };
        box.appendChild(b);
      });
    } else {
      card.innerHTML = `
        <h3 class="modal-title" style="font-size:18px;">命格已定 · 即将启程</h3>
        <div class="story-box" style="margin-bottom:12px;">
          <b>灵根资质：</b>${G.root}<br>
          <b>初始命格：</b>${G.talent}<br>
          <b>初始属性：</b>根骨 ${G.body} · 悟性 ${G.wit} · 气运 ${G.luck} · 口才 ${G.talk} · 道心 ${G.mind}
        </div>
        <label style="font-size:12px;color:#b7a892;">请定道号：</label>
        <input id="inp-name" value="${G.name}" maxlength="8" style="background:#14100d;border:1px solid #d4af37;color:#f3d778;padding:6px 10px;border-radius:5px;margin:0 8px 14px;" />
        <button class="btn-action" id="btn-enter">踏入青云界</button>
      `;
      document.getElementById('btn-enter').onclick = () => {
        const val = document.getElementById('inp-name').value.trim();
        if (val) G.name = val;
        SFX.play('levelup');
        modal.style.display = 'none';
        saveGame('auto', true);
        renderAll();
      };
    }
  }
  renderStep();
}

function buyItem(id) {
  const it = ITEMS_DB[id];
  if (G.stone < it.price) return showToast('灵石不足。');
  G.stone -= it.price;
  if (it.type === 'box') {
    const r = Math.random();
    if (r < 0.45) { G.stone += 65; showToast('启封遗匣，内藏 65 枚下品灵石。'); }
    else if (r < 0.8) { const g = gainExp(55); showToast(`遗匣中藏有一页前人修炼心得，修为 +${g}。`); }
    else { showToast('遗匣年代久远，灵气已散尽，只余几块碎石。'); }
  } else {
    G.bag[id] = (G.bag[id] || 0) + 1;
    showToast(`购得【${it.name}】×1。`);
  }
  saveGame('auto', true);
  renderAll();
}

function startBattle(enemy) {
  battleState = {
    enemy: { ...enemy },
    shield: 0,
    stunned: false,
    log: [`迎战【${enemy.name}】！`]
  };
  currentTab = 'explore';
  renderAll();
}

function useBattleSkill(skillId) {
  if (!battleState) return;
  const sk = SKILLS_DB[skillId];
  const e = battleState.enemy;
  if (G.qi < sk.cost) return showToast('灵力不足，可先服丹药或暂避锋芒。');
  if (sk.stoneCost && G.stone < sk.stoneCost) return showToast(`灵石不足 ${sk.stoneCost}，难以催动此术。`);

  G.qi -= sk.cost;
  if (sk.stoneCost) G.stone -= sk.stoneCost;

  let dmg = Math.floor((G.body * 2.2 + G.wit * 1.4) * sk.power);
  if (sk.talkScale) {
    dmg = Math.floor(G.talk * sk.talkScale + Math.random() * 12);
    if (e.talkDef > 100) {
      dmg = 5;
      battleState.log.push('天雷无情，言辞辩法仅造成微弱波澜（伤害 5）。');
    } else if (sk.stun && Math.random() < 0.6) {
      battleState.stunned = true;
      battleState.log.push(`你施展【${sk.name}】，对方心神失守，陷入迟滞！`);
    }
  }
  if (sk.shield) {
    battleState.shield += sk.shield;
    battleState.log.push(`身形疾退卸力，获得 ${sk.shield} 点护体灵盾。`);
  }

  e.hp = Math.max(0, e.hp - dmg);
  SFX.play(sk.id === 'grandpa_finger' ? 'thunder' : 'sword');
  FX.burst(sk.id === 'sister_frost' ? '130,210,255' : '243,215,120', 22);
  triggerShake();
  battleState.log.push(`施展【${sk.name}】，对 ${e.name} 造成 ${dmg} 点伤害。`);

  if (e.hp <= 0) {
    const wonTrib = e.isTribulation;
    const expG = e.expReward ? gainExp(e.expReward) : 0;
    G.stone += e.stoneReward || 0;
    G.fame += 5;
    battleState = null; activeScene = null;
    if (wonTrib) {
      tryRealmUp(true);
    } else {
      SFX.play('levelup');
      showToast(`得胜！修为 +${expG}，灵石 +${e.stoneReward}。`);
    }
    saveGame('auto', true); renderAll(); return;
  }

  if (battleState.stunned) {
    battleState.stunned = false;
    battleState.log.push(`${e.name} 心神未定，错失本回合攻势。`);
  } else {
    let eDmg = Math.max(4, e.atk - Math.floor(G.body * 0.35) + Math.floor(Math.random()*6));
    if (battleState.shield > 0) {
      const absorbed = Math.min(battleState.shield, eDmg);
      battleState.shield -= absorbed; eDmg -= absorbed;
    }
    G.hp = Math.max(0, G.hp - eDmg);
    battleState.log.push(`${e.name} 发动反击，造成 ${eDmg} 点伤害。`);
  }

  if (G.hp <= 0) {
    G.hp = Math.floor(G.maxHp * 0.5);
    G.qi = Math.floor(G.maxQi * 0.5);
    battleState = null; activeScene = null;
    showToast('力竭败退，幸得古玉残魂护持脱身。');
  }
  renderAll();
}

function saveGame(slot = 'auto', silent = false) {
  try {
    localStorage.setItem('jy3_xianxia_save_' + slot, JSON.stringify({ savedAt: new Date().toLocaleString(), data: G }));
    if (!silent) showToast(`已保存至【${slot === 'auto' ? '自动存档' : '存档位 ' + slot}】。`);
  } catch { if (!silent) showToast('保存失败。'); }
}
function loadGame(slot = 'auto') {
  try {
    const raw = localStorage.getItem('jy3_xianxia_save_' + slot);
    if (!raw) return false;
    G = JSON.parse(raw).data;
    battleState = null; activeScene = null;
    showToast('读取存档成功。');
    return true;
  } catch { return false; }
}

function renderAll() {
  if (!G) return;
  const realm = REALMS[G.realmIdx];
  document.getElementById('ui-name').textContent = G.name;
  document.getElementById('ui-realm').textContent = realm.name;
  document.getElementById('ui-talent').textContent = `${G.root} | ${G.talent}`;
  document.getElementById('ui-hp-txt').textContent = `${G.hp} / ${G.maxHp}`;
  document.getElementById('ui-qi-txt').textContent = `${G.qi} / ${G.maxQi}`;
  document.getElementById('ui-exp-txt').textContent = `${G.exp} / ${realm.exp}`;
  document.getElementById('ui-hp-bar').style.width = Math.min(100, (G.hp / G.maxHp)*100) + '%';
  document.getElementById('ui-qi-bar').style.width = Math.min(100, (G.qi / G.maxQi)*100) + '%';
  document.getElementById('ui-exp-bar').style.width = Math.min(100, (G.exp / realm.exp)*100) + '%';

  document.getElementById('st-body').textContent = G.body;
  document.getElementById('st-wit').textContent = G.wit;
  document.getElementById('st-luck').textContent = G.luck;
  document.getElementById('st-talk').textContent = G.talk;
  document.getElementById('st-mind').textContent = G.mind;
  document.getElementById('st-fame').textContent = G.fame;

  document.getElementById('ui-sect').textContent = G.sect;
  document.getElementById('ui-age').textContent = `${G.age} / ${G.maxAge}岁`;
  document.getElementById('ui-stone').textContent = G.stone;
  document.getElementById('ui-date').textContent = getDateStr();

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  const stage = document.getElementById('stage-body');
  stage.innerHTML = '';

  if (battleState) {
    document.getElementById('ui-loc-title').textContent = `⚔️ 实战交锋 · ${battleState.enemy.name}`;
    const e = battleState.enemy;
    const arena = document.createElement('div');
    arena.className = 'battle-arena';
    arena.innerHTML = `
      <div class="fighter">
        <div class="fighter-top"><span>${G.name}</span><span style="color:#6fd49e;">灵盾 ${battleState.shield}</span></div>
        <div class="bar-track"><div class="bar-fill hp-fill" style="width:${(G.hp/G.maxHp)*100}%"></div></div>
        <div style="font-size:11px;color:#b7a892;">气血 ${G.hp}/${G.maxHp} · 灵力 ${G.qi}/${G.maxQi}</div>
      </div>
      <div style="font-size:18px;color:#d4af37;font-weight:800;">VS</div>
      <div class="fighter">
        <div class="fighter-top"><span style="color:#ff8a8a;">${e.name}</span><span>${e.hp}/${e.maxHp}</span></div>
        <div class="bar-track"><div class="bar-fill hp-fill" style="width:${(e.hp/e.maxHp)*100}%"></div></div>
        <div style="font-size:11px;color:#b7a892;">攻势 ~${e.atk}</div>
      </div>
    `;
    stage.appendChild(arena);

    const logBox = document.createElement('div');
    logBox.className = 'battle-log';
    logBox.innerHTML = battleState.log.slice(-6).map(l => `<div>• ${l}</div>`).join('');
    stage.appendChild(logBox);

    const skBar = document.createElement('div');
    skBar.className = 'skill-bar';
    G.skills.forEach(sid => {
      const sk = SKILLS_DB[sid];
      const b = document.createElement('button');
      b.className = 'btn-action';
      b.innerHTML = `${sk.name}<br><span style="font-size:10px;opacity:0.8;">灵力${sk.cost}${sk.stoneCost ? ' 灵石'+sk.stoneCost : ''}</span>`;
      b.onclick = () => useBattleSkill(sid);
      skBar.appendChild(b);
    });
    const runBtn = document.createElement('button');
    runBtn.className = 'btn-action secondary';
    runBtn.innerHTML = '遁走撤离<br><span style="font-size:10px;">保全自身</span>';
    runBtn.onclick = () => { battleState = null; activeScene = null; showToast('借地形遁走脱身。'); renderAll(); };
    skBar.appendChild(runBtn);
    stage.appendChild(skBar);
    return;
  }

  if (currentTab === 'explore') {
    document.getElementById('ui-loc-title').textContent = activeScene ? `📜 江湖际遇` : `🗺️ 青云界 · 舆图`;
    if (activeScene) {
      const box = document.createElement('div');
      box.className = 'story-box';
      box.innerHTML = `
        <div class="speaker-line">
          <img class="speaker-ava" src="${activeScene.img || ASSETS.hero}" />
          <div>
            <div class="speaker-name">${activeScene.speaker}</div>
            <div>${activeScene.text}</div>
          </div>
        </div>
      `;
      stage.appendChild(box);
      const cl = document.createElement('div');
      cl.className = 'choices-list';
      activeScene.choices.forEach(c => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.innerHTML = `<span>${c.text}</span>${c.hint ? `<span class="choice-hint">[${c.hint}]</span>` : ''}`;
        b.onclick = () => { SFX.play('click'); c.action(); };
        cl.appendChild(b);
      });
      stage.appendChild(cl);
    } else {
      const grid = document.createElement('div');
      grid.className = 'loc-grid';
      LOCATIONS.forEach(loc => {
        const card = document.createElement('div');
        card.className = 'loc-card';
        card.innerHTML = `<div class="l-name">${loc.name}</div><div class="l-tag">${loc.tag}</div><div class="l-desc">${loc.desc}</div>`;
        card.onclick = () => visitLocation(loc.id);
        grid.appendChild(card);
      });
      stage.appendChild(grid);
    }
  } else if (currentTab === 'cultivate') {
    document.getElementById('ui-loc-title').textContent = '🧘 闭关吐纳';
    const next = REALMS[G.realmIdx + 1];
    stage.innerHTML = `
      <div class="story-box">
        当前境界：<b>${realm.name}</b>（修为 ${G.exp} / ${realm.exp}）<br>
        ${next ? `下一境界：<b>${next.name}</b> ${next.tribulation ? '（修为圆满后需登【九霄渡劫台】渡劫）' : '（修为圆满后自动突破）'}` : '已臻化境。'}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-action" id="btn-meditate">静室吐纳 (+1月，恢复气血灵力并增进修为)</button>
        <button class="btn-action secondary" id="btn-work">替坊市抄录阵图符箓 (+1月，赚取 25 灵石)</button>
      </div>
    `;
    document.getElementById('btn-meditate').onclick = () => {
      SFX.play('click'); advanceTime(1);
      G.hp = G.maxHp; G.qi = G.maxQi;
      const g = gainExp(35);
      showToast(`静修一月，修为 +${g}。`);
      saveGame('auto', true); renderAll();
    };
    document.getElementById('btn-work').onclick = () => {
      SFX.play('click'); advanceTime(1);
      G.stone += 25;
      showToast('抄录符箓一月，获酬 25 灵石。');
      saveGame('auto', true); renderAll();
    };
  } else if (currentTab === 'skills') {
    document.getElementById('ui-loc-title').textContent = '⚔️ 功法神通';
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    G.skills.forEach(sid => {
      const s = SKILLS_DB[sid];
      const d = document.createElement('div');
      d.className = 'card-row';
      d.innerHTML = `<div><h4>${s.name}</h4><p>${s.desc}</p></div><span style="font-size:11px;color:#f3d778;flex-shrink:0;">灵力 ${s.cost}</span>`;
      grid.appendChild(d);
    });
    stage.appendChild(grid);
  } else if (currentTab === 'bag') {
    document.getElementById('ui-loc-title').textContent = '🎒 行囊法宝';
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    const entries = Object.entries(G.bag).filter(([,cnt]) => cnt > 0);
    if (!entries.length) {
      stage.innerHTML = '<div class="story-box">行囊之中暂无器物，可前往鬼市购置丹药阵盘。</div>';
    } else {
      entries.forEach(([id, cnt]) => {
        const it = ITEMS_DB[id];
        const row = document.createElement('div');
        row.className = 'card-row';
        row.innerHTML = `<div><h4>${it.name} ×${cnt}</h4><p>${it.desc}</p></div>`;
        if (it.type === 'consumable' || it.type === 'box') {
          const btn = document.createElement('button');
          btn.className = 'btn-action'; btn.textContent = '使用';
          btn.onclick = () => {
            G.bag[id]--;
            if (it.hp) G.hp = Math.min(G.maxHp, G.hp + it.hp);
            if (it.qi) G.qi = Math.min(G.maxQi, G.qi + it.qi);
            if (it.type === 'box') { G.stone += 50; showToast('启封遗匣，得 50 灵石。'); }
            else showToast(`服用了 ${it.name}。`);
            renderAll();
          };
          row.appendChild(btn);
        }
        grid.appendChild(row);
      });
      stage.appendChild(grid);
    }
  } else if (currentTab === 'allies') {
    document.getElementById('ui-loc-title').textContent = '🤝 道友与故交';
    Object.entries(G.allies).forEach(([k, a]) => {
      const row = document.createElement('div');
      row.className = 'card-row'; row.style.marginBottom = '8px';
      row.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center;">
          <img class="speaker-ava" src="${k === 'sister' ? ASSETS.sister : ASSETS.hero}" />
          <div><h4>${a.name}（${a.title}）</h4><p>${a.desc}</p></div>
        </div>
        <div style="font-size:12px;color:#f3d778;flex-shrink:0;">交情：${a.bond}</div>
      `;
      stage.appendChild(row);
    });
  } else if (currentTab === 'save') {
    document.getElementById('ui-loc-title').textContent = '💾 存档与设置';
    stage.innerHTML = `
      <div class="story-box">
        <b>iPhone 离线安装方法：</b>将游戏文件夹上传至任意 HTTPS 静态空间（如 GitHub Pages），用 Safari 打开后点击「分享 → 添加到主屏幕」，即可离线全屏游玩。
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-action" onclick="saveGame('1')">存入存档位 1</button>
        <button class="btn-action secondary" onclick="if(loadGame('1')) renderAll(); else showToast('存档位 1 为空。');">读取存档位 1</button>
        <button class="btn-action" onclick="saveGame('2')">存入存档位 2</button>
        <button class="btn-action secondary" onclick="if(loadGame('2')) renderAll(); else showToast('存档位 2 为空。');">读取存档位 2</button>
        <button class="btn-action secondary" id="btn-sfx">${SFX.enabled ? '🔊 音效：开启' : '🔇 音效：关闭'}</button>
        <button class="btn-action secondary" onclick="startQuiz()">🔄 重新开局</button>
      </div>
    `;
    document.getElementById('btn-sfx').onclick = () => { SFX.enabled = !SFX.enabled; renderAll(); };
  }
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => { SFX.play('click'); currentTab = btn.dataset.tab; renderAll(); };
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
FX.init();
startQuiz();
</script>
</body>
</html>
